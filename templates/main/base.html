<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор недвижимости</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

</head>
<body>
<h1 class="text-center">Оценка стоимости недвижимости</h1>

{% block content %}
    <div class="d-grid gap-2 col-6 mx-auto" style="margin-top: 100px">
        {% if not is_authenticated %}
            <button onclick="document.location='http://127.0.0.1:8000/registration/login/'" type="button"
                    class="btn btn-outline-light"
                    style="--bs-btn-padding-y: 10px; --bs-btn-padding-x: 10px; --bs-btn-font-size: 20px;">
                Войти
            </button>
            <button onclick="document.location='http://127.0.0.1:8000/registration/'" type="button"
                    class="btn btn-outline-light"
                    style="--bs-btn-padding-y: 10px; --bs-btn-padding-x: 10px; --bs-btn-font-size: 20px;">
                Регистрация
            </button>
        {% else %}
            <button onclick="document.location='http://127.0.0.1:8000/registration/profile/'" type="button"
                    class="btn btn-outline-light"
                    style="--bs-btn-padding-y: 10px; --bs-btn-padding-x: 10px; --bs-btn-font-size: 20px;">
                Мой профиль
            </button>
            <button onclick="document.location='http://127.0.0.1:8000/registration/logout/'" type="button"
                    class="btn btn-outline-light"
                    style="--bs-btn-padding-y: 10px; --bs-btn-padding-x: 10px; --bs-btn-font-size: 20px;">
                Выйти
            </button>
        {% endif %}
        <button onclick="document.location='http://127.0.0.1:8000/input_params/'" type="button"
                class="btn btn-outline-light"
                style="--bs-btn-padding-y: 10px; --bs-btn-padding-x: 10px; --bs-btn-font-size: 20px;">
            <a>Оценить стоимость</a>
        </button>
        <button onclick="document.location='http://127.0.0.1:8000/about/'" type="button" class="btn btn-outline-light"
                style="--bs-btn-padding-y: 10px; --bs-btn-padding-x: 10px; --bs-btn-font-size: 20px;">
            About
        </button>
    </div>
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"
        integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>
</html>
